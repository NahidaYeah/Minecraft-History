<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>合成大学</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0f0f23;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;
  font-family:'Microsoft YaHei','PingFang SC',sans-serif;
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
#game-container{position:relative;width:420px;max-width:100vw}
#header{
  display:flex;justify-content:center;align-items:center;
  padding:10px 16px;
  background:linear-gradient(135deg,#1a1a3e,#2a2a5e);
  border-radius:12px 12px 0 0;
  border:2px solid #3a3a6e;border-bottom:none;
}
#score-display{color:#ffd700;font-size:20px;font-weight:bold;text-shadow:0 0 10px rgba(255,215,0,0.5)}
#canvas-wrap{position:relative;border-left:2px solid #3a3a6e;border-right:2px solid #3a3a6e;background:#12122a;cursor:pointer}
canvas{display:block;width:100%}
#footer{padding:8px 16px;background:linear-gradient(135deg,#1a1a3e,#2a2a5e);border-radius:0 0 12px 12px;border:2px solid #3a3a6e;border-top:none;text-align:center;color:#666;font-size:12px}
#game-over{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:100;flex-direction:column;justify-content:center;align-items:center;border-radius:12px}
#game-over.show{display:flex}
#game-over h2{color:#ff4444;font-size:36px;margin-bottom:10px;text-shadow:0 0 20px rgba(255,68,68,0.5)}
#game-over .final-score{color:#ffd700;font-size:24px;margin-bottom:24px}
#game-over button{padding:12px 40px;font-size:18px;background:linear-gradient(135deg,#4CAF50,#45a049);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;transition:transform 0.1s}
#game-over button:hover{transform:scale(1.05)}
#game-over button:active{transform:scale(0.95)}
#loading{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(15,15,35,0.95);z-index:200;display:flex;flex-direction:column;justify-content:center;align-items:center;border-radius:12px;color:#aaa;font-size:16px}
#loading .spinner{width:40px;height:40px;border:4px solid #3a3a6e;border-top-color:#ffd700;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="game-container">
  <div id="header">
    <div id="score-display">分数: 0</div>
  </div>
  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="420" height="620"></canvas>
    <div id="loading"><div class="spinner"></div>加载中...</div>
    <div id="game-over">
      <h2>游戏结束</h2>
      <div class="final-score" id="final-score">最终分数: 0</div>
      <button id="restart-btn">重新开始</button>
    </div>
  </div>
  <div id="footer">点击屏幕投放校徽 · 相同校徽合并为更大的大学</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
(function(){
'use strict';

// ==================== 游戏配置 ====================
const W = 420, H = 620;
const WALL_T = 14;
const DANGER_Y = 80;
const DROP_Y = 40;

// 9 个大学等级：清华(最小) → 北大(最大)
const UNIS = [
  { name:'清华大学',         color:'#7B1FA2', radius:18, score:1,  img:'tsinghua.webp'  },
  { name:'郑州大学',         color:'#2E7D32', radius:24, score:3,  img:'zhengzhou.png'  },
  { name:'南京工业大学',     color:'#00796B', radius:32, score:6,  img:'nanjing-tech.png'},
  { name:'中南财经政法大学', color:'#E65100', radius:40, score:10, img:'zhongnan.png'   },
  { name:'武汉理工大学',     color:'#1565C0', radius:48, score:15, img:'wuhan-tech.png' },
  { name:'华中农业大学',     color:'#558B2F', radius:56, score:21, img:'huazhong-agri.png'},
  { name:'湖南大学',         color:'#1565C0', radius:64, score:28, img:'hunan.png'      },
  { name:'北京理工大学',     color:'#6A1B9A', radius:74, score:36, img:'beijing-tech.png'},
  { name:'北京大学',         color:'#C62828', radius:82, score:45, img:'peking.webp'    },
];

// ==================== Matter.js 物理引擎 ====================
const { Engine, Bodies, Body, Events, Composite, Runner } = Matter;
const engine = Engine.create({ gravity:{ x:0, y:1.2, scale:0.001 } });

const wallOpts = { isStatic:true, friction:0.4, restitution:0.15, render:{ visible:false } };
Composite.add(engine.world, [
  Bodies.rectangle(W/2, H+30, W+60, 60, wallOpts),
  Bodies.rectangle(-WALL_T/2, H/2, WALL_T, H*2, wallOpts),
  Bodies.rectangle(W+WALL_T/2, H/2, WALL_T, H*2, wallOpts),
]);

// ==================== 游戏状态 ====================
let score = 0, currentTier = 0, nextTier = randTier();
let gameOver = false, canDrop = true, dropCooldown = 0;
let uniBodies = [], particles = [], previewX = W/2;

function randTier(){
  const r = Math.random();
  if(r < 0.79) return 0;
  if(r < 0.98) return 1;
  return 2;
}

// ==================== Canvas 渲染 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ==================== 图片加载 ====================
const imgCache = [];
let imagesLoaded = 0;
const totalImages = UNIS.length;

function loadImage(tier){
  const u = UNIS[tier];
  const img = new Image();
  img.onload = function(){
    imgCache[tier] = img;
    imagesLoaded++;
    if(imagesLoaded >= totalImages){
      document.getElementById('loading').style.display = 'none';
      startGame();
    }
  };
  img.onerror = function(){
    // Fallback: create a colored circle if image fails
    const c = document.createElement('canvas');
    const s = u.radius * 2;
    c.width = c.height = s;
    const g = c.getContext('2d');
    g.fillStyle = u.color;
    g.beginPath(); g.arc(s/2, s/2, u.radius, 0, Math.PI*2); g.fill();
    imgCache[tier] = c;
    imagesLoaded++;
    if(imagesLoaded >= totalImages){
      document.getElementById('loading').style.display = 'none';
      startGame();
    }
  };
  img.src = u.img;
}

// 加载所有图片
UNIS.forEach((_, i) => loadImage(i));

// ==================== 绘制函数 ====================
function drawUni(x, y, tier, alpha){
  const u = UNIS[tier];
  const img = imgCache[tier];
  if(!img) return;

  ctx.save();
  ctx.globalAlpha = alpha || 1;

  // 圆形裁剪
  ctx.beginPath();
  ctx.arc(x, y, u.radius, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();

  // 先填充主题色背景，防止图片白边露出
  ctx.fillStyle = u.color;
  ctx.fillRect(x - u.radius, y - u.radius, u.radius * 2, u.radius * 2);

  // 绘制图片（保持宽高比，居中填充）
  const diam = u.radius * 2;
  let sx=0, sy=0, sw=img.naturalWidth||img.width, sh=img.naturalHeight||img.height;
  const scale = Math.max(diam/sw, diam/sh);
  const dw = sw*scale, dh = sh*scale;
  ctx.drawImage(img, x - dw/2, y - dh/2, dw, dh);

  ctx.restore();
}

function drawContainer(){
  ctx.fillStyle = '#2a2a5e';
  ctx.fillRect(0, 0, WALL_T, H);
  ctx.fillRect(W-WALL_T, 0, WALL_T, H);
  ctx.fillRect(0, H-WALL_T, W, WALL_T);
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fillRect(WALL_T, 0, 2, H);
  ctx.fillRect(W-WALL_T-2, 0, 2, H);
}

function drawDangerLine(){
  ctx.save();
  ctx.setLineDash([8,6]);
  ctx.strokeStyle = 'rgba(255,60,60,0.45)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(WALL_T, DANGER_Y);
  ctx.lineTo(W-WALL_T, DANGER_Y);
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.fillStyle = 'rgba(255,60,60,0.5)';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('⚠ 危险线', WALL_T+4, DANGER_Y-6);
  ctx.restore();
}

function drawPreview(){
  if(!canDrop || gameOver) return;
  const u = UNIS[currentTier];
  ctx.save();
  ctx.globalAlpha = 0.4;
  drawUni(previewX, DROP_Y, currentTier, 0.5);
  ctx.beginPath();
  ctx.arc(previewX, DROP_Y, u.radius, 0, Math.PI*2);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.setLineDash([5,4]);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(previewX, DROP_Y + u.radius + 4);
  ctx.lineTo(previewX, H - WALL_T);
  ctx.strokeStyle = u.color + '55';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([3,6]);
  ctx.stroke();
  ctx.restore();
}

function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    const t = p.life / p.maxLife;
    ctx.save();
    ctx.globalAlpha = t;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*t, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function spawnMergeEffect(x, y, color, count){
  count = count || 14;
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2/count)*i + Math.random()*0.4;
    const speed = 2.5 + Math.random()*4;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed - 1,
      life: 25 + Math.random()*20,
      maxLife: 45,
      color: color,
      size: 2.5 + Math.random()*4
    });
  }
}

// ==================== 创建大学球体 ====================
function createUni(tier, x, y){
  const u = UNIS[tier];
  const body = Bodies.circle(x, y, u.radius, {
    restitution: 0.2, friction: 0.5, frictionAir: 0.001,
    density: 0.0008 + tier*0.0002, label: 'uni'
  });
  body.gameTier = tier;
  Composite.add(engine.world, body);
  uniBodies.push(body);
  return body;
}

function removeBody(body){
  Composite.remove(engine.world, body);
  uniBodies = uniBodies.filter(b => b !== body);
}

// ==================== 投放逻辑 ====================
function drop(){
  if(!canDrop || gameOver) return;
  canDrop = false;
  dropCooldown = 22;
  const tier = currentTier;
  currentTier = nextTier;
  nextTier = randTier();
  const body = createUni(tier, previewX, DROP_Y);
  Body.setVelocity(body, { x:(Math.random()-0.5)*1.2, y:1.5 });
}

// ==================== 碰撞 & 合并 ====================
// 接触帧计数器：记录每对球体的接触帧数
const contactFrames = new Map();

function getPairKey(a, b){
  return a.id < b.id ? a.id+'-'+b.id : b.id+'-'+a.id;
}

function doMerge(a, b){
  if(a.gameTier >= UNIS.length - 1) return;
  const newTier = a.gameTier + 1;
  const mx = (a.position.x + b.position.x)/2;
  const my = (a.position.y + b.position.y)/2;

  removeBody(a); removeBody(b);

  const newBody = createUni(newTier, mx, my);
  Body.setVelocity(newBody, { x:0, y:-2.5 });

  score += UNIS[newTier].score;
  document.getElementById('score-display').textContent = '分数: '+score;

  spawnMergeEffect(mx, my, UNIS[newTier].color);
  if(newTier === UNIS.length - 1){
    spawnMergeEffect(mx, my, '#ffd700', 28);
  }
}

Events.on(engine, 'collisionStart', function(e){
  if(gameOver) return;
  for(const pair of e.pairs){
    const a = pair.bodyA, b = pair.bodyB;
    if(a.gameTier === undefined || b.gameTier === undefined) continue;
    if(a.gameTier !== b.gameTier) continue;
    doMerge(a, b);
  }
});

// 每帧检查：捕获 collisionStart 未触发的情况（球体已静止接触）
function checkPendingMerges(){
  if(gameOver || uniBodies.length < 2) return;
  for(let i=0; i<uniBodies.length; i++){
    const a = uniBodies[i];
    if(a.gameTier === undefined) continue;
    for(let j=i+1; j<uniBodies.length; j++){
      const b = uniBodies[j];
      if(b.gameTier === undefined) continue;
      if(a.gameTier !== b.gameTier) continue;

      const dx = a.position.x - b.position.x;
      const dy = a.position.y - b.position.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const minDist = a.circleRadius + b.circleRadius;

      // 球体接触或轻微重叠
      if(dist <= minDist * 1.05){
        const key = getPairKey(a, b);
        const frames = (contactFrames.get(key) || 0) + 1;
        contactFrames.set(key, frames);

        // 接触超过 4 帧且速度较低时合并
        if(frames >= 4){
          const speedA = Math.sqrt(a.velocity.x**2 + a.velocity.y**2);
          const speedB = Math.sqrt(b.velocity.x**2 + b.velocity.y**2);
          if(speedA < 3 && speedB < 3){
            contactFrames.delete(key);
            doMerge(a, b);
            return; // 一次只处理一对，避免连锁问题
          }
        }
      } else {
        contactFrames.delete(getPairKey(a, b));
      }
    }
  }
}

// ==================== 输入处理 ====================
function updatePreviewX(clientX){
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const u = UNIS[currentTier];
  const rawX = (clientX - rect.left) * scaleX;
  previewX = Math.max(WALL_T+u.radius+2, Math.min(W-WALL_T-u.radius-2, rawX));
}

const canvasWrap = document.getElementById('canvas-wrap');
canvasWrap.addEventListener('mousemove', e => updatePreviewX(e.clientX));
canvasWrap.addEventListener('click', e => { updatePreviewX(e.clientX); drop(); });

// 触摸：touchstart 更新位置，touchend 投放
canvasWrap.addEventListener('touchstart', e => {
  e.preventDefault();
  updatePreviewX(e.touches[0].clientX);
}, {passive:false});
canvasWrap.addEventListener('touchmove', e => {
  e.preventDefault();
  updatePreviewX(e.touches[0].clientX);
}, {passive:false});
canvasWrap.addEventListener('touchend', e => {
  e.preventDefault();
  drop();
}, {passive:false});

// ==================== 游戏结束检测 ====================
function checkGameOver(){
  for(const body of uniBodies){
    const r = UNIS[body.gameTier].radius;
    if(body.position.y - r < DANGER_Y
       && Math.abs(body.velocity.y) < 0.4
       && Math.abs(body.velocity.x) < 0.4){
      if(!body._dangerTimer) body._dangerTimer = 0;
      body._dangerTimer++;
      if(body._dangerTimer > 150){ endGame(); return; }
    } else {
      body._dangerTimer = 0;
    }
  }
}

function endGame(){
  gameOver = true;
  document.getElementById('final-score').textContent = '最终分数: '+score;
  document.getElementById('game-over').classList.add('show');
}

document.getElementById('restart-btn').addEventListener('click', ()=>{
  for(const b of uniBodies) Composite.remove(engine.world, b);
  uniBodies = []; particles = [];
  contactFrames.clear();
  score = 0; gameOver = false; canDrop = true; dropCooldown = 0;
  currentTier = randTier(); nextTier = randTier();
  document.getElementById('score-display').textContent = '分数: 0';
  document.getElementById('game-over').classList.remove('show');
});

// ==================== 主循环 ====================
const FRAME_MS = 1000/60;
let gameStarted = false;

function gameLoop(){
  Engine.update(engine, FRAME_MS);

  if(!canDrop){ dropCooldown--; if(dropCooldown<=0) canDrop=true; }
  for(let i=uniBodies.length-1;i>=0;i--){
    if(uniBodies[i].position.y > H+120) removeBody(uniBodies[i]);
  }
  checkPendingMerges();
  if(!gameOver && dropCooldown<=0 && uniBodies.length>0) checkGameOver();

  // ===== 渲染 =====
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#12122a';
  ctx.fillRect(0, 0, W, H);

  drawContainer();
  drawDangerLine();
  drawPreview();

  for(const body of uniBodies){
    drawUni(body.position.x, body.position.y, body.gameTier);
  }

  drawParticles();

  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('球体: '+uniBodies.length, W-14, H-14);
  ctx.restore();
}

function startGame(){
  if(gameStarted) return;
  gameStarted = true;
  currentTier = randTier();
  nextTier = randTier();

  const runner = Runner.create();
  Runner.run(runner, engine);

  let loopStarted = false;
  try {
    requestAnimationFrame(function(){
      loopStarted = true;
      (function loop(){ gameLoop(); requestAnimationFrame(loop); })();
    });
  } catch(e){}
  setTimeout(function(){
    if(!loopStarted) setInterval(gameLoop, FRAME_MS);
  }, 500);
}

})();
</script>
</body>
</html>
