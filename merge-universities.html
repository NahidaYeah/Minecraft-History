<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>合成大学</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0f0f23;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;
  font-family:'Microsoft YaHei','PingFang SC',sans-serif;
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
#game-container{position:relative;width:420px;max-width:100vw}
#header{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;
  background:linear-gradient(135deg,#1a1a3e,#2a2a5e);
  border-radius:12px 12px 0 0;
  border:2px solid #3a3a6e;border-bottom:none;
}
#score-display{color:#ffd700;font-size:20px;font-weight:bold;text-shadow:0 0 10px rgba(255,215,0,0.5)}
#next-display{display:flex;align-items:center;gap:8px;color:#aaa;font-size:14px}
#next-icon{width:28px;height:28px;border-radius:50%;display:inline-block;border:2px solid rgba(255,255,255,0.3)}
#canvas-wrap{position:relative;border-left:2px solid #3a3a6e;border-right:2px solid #3a3a6e;background:#12122a;cursor:pointer}
canvas{display:block;width:100%}
#footer{padding:8px 16px;background:linear-gradient(135deg,#1a1a3e,#2a2a5e);border-radius:0 0 12px 12px;border:2px solid #3a3a6e;border-top:none;text-align:center;color:#666;font-size:12px}
#game-over{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:100;flex-direction:column;justify-content:center;align-items:center;border-radius:12px}
#game-over.show{display:flex}
#game-over h2{color:#ff4444;font-size:36px;margin-bottom:10px;text-shadow:0 0 20px rgba(255,68,68,0.5)}
#game-over .final-score{color:#ffd700;font-size:24px;margin-bottom:24px}
#game-over button{padding:12px 40px;font-size:18px;background:linear-gradient(135deg,#4CAF50,#45a049);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;transition:transform 0.1s}
#game-over button:hover{transform:scale(1.05)}
#game-over button:active{transform:scale(0.95)}
</style>
</head>
<body>
<div id="game-container">
  <div id="header">
    <div id="score-display">分数: 0</div>
    <div id="next-display">下一个: <span id="next-icon"></span><span id="next-name"></span></div>
  </div>
  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="420" height="620"></canvas>
    <div id="game-over">
      <h2>游戏结束</h2>
      <div class="final-score" id="final-score">最终分数: 0</div>
      <button id="restart-btn">重新开始</button>
    </div>
  </div>
  <div id="footer">点击屏幕投放校徽 · 相同校徽合并为更大的大学</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
(function(){
'use strict';

// ==================== 游戏配置 ====================
const W = 420, H = 620;
const WALL_T = 14;           // 墙壁厚度（视觉）
const DANGER_Y = 80;
const DROP_Y = 40;

const UNIS = [
  { name:'郑州大学',         short:'郑大',   color:'#4CAF50', radius:22, score:1  },
  { name:'南京工业大学',     short:'南工大', color:'#009688', radius:30, score:3  },
  { name:'中南财经政法大学', short:'中南财', color:'#FF9800', radius:38, score:6  },
  { name:'华中农业大学',     short:'华农',   color:'#8BC34A', radius:47, score:10 },
  { name:'湖南大学',         short:'湖大',   color:'#2196F3', radius:57, score:15 },
  { name:'北京理工大学',     short:'北理工', color:'#9C27B0', radius:68, score:21 },
  { name:'北京大学',         short:'北大',   color:'#f44336', radius:80, score:30 },
];

// ==================== Matter.js 物理引擎 ====================
const { Engine, Bodies, Body, Events, Composite, Runner } = Matter;

const engine = Engine.create({ gravity:{ x:0, y:1.2, scale:0.001 } });

// 容器墙壁（不可见，纯物理）
const wallOpts = { isStatic:true, friction:0.4, restitution:0.15, render:{ visible:false } };
const ground = Bodies.rectangle(W/2, H+30, W+60, 60, wallOpts);
const leftWall  = Bodies.rectangle(-WALL_T/2, H/2, WALL_T, H*2, wallOpts);
const rightWall = Bodies.rectangle(W+WALL_T/2, H/2, WALL_T, H*2, wallOpts);
Composite.add(engine.world, [ground, leftWall, rightWall]);

// ==================== 游戏状态 ====================
let score = 0;
let currentTier = 0;
let nextTier = randTier();
let gameOver = false;
let canDrop = true;
let dropCooldown = 0;
let uniBodies = [];   // 所有大学球体
let particles = [];
let previewX = W / 2;

function randTier(){ return Math.floor(Math.random() * 3); }

// ==================== Canvas 渲染 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function lighten(hex, amt){
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+amt); g=Math.min(255,g+amt); b=Math.min(255,b+amt);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// 绘制一个大学校徽
function drawUni(x, y, tier, alpha){
  const u = UNIS[tier];
  const r = u.radius;
  alpha = alpha || 1;

  ctx.save();
  ctx.globalAlpha = alpha;

  // 外圈光晕
  const glow = ctx.createRadialGradient(x,y,r*0.5,x,y,r+4);
  glow.addColorStop(0, u.color+'88');
  glow.addColorStop(1, u.color+'00');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(x,y,r+4,0,Math.PI*2); ctx.fill();

  // 主体渐变圆
  const grad = ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
  grad.addColorStop(0, lighten(u.color,50));
  grad.addColorStop(1, u.color);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();

  // 白色边框
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();

  // 内圈装饰线
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x,y,r*0.72,0,Math.PI*2); ctx.stroke();

  // 大学简称
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fs = Math.max(11, r * 0.44);
  ctx.font = `bold ${fs}px "Microsoft YaHei","PingFang SC",sans-serif`;
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 4;
  ctx.fillText(u.short, x, y - fs*0.1);
  ctx.shadowBlur = 0;

  // 等级
  ctx.font = `bold ${Math.max(8, r*0.26)}px sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('Lv'+(tier+1), x, y + fs*0.55);

  ctx.restore();
}

// 绘制容器边框
function drawContainer(){
  // 左墙
  ctx.fillStyle = '#2a2a5e';
  ctx.fillRect(0, 0, WALL_T, H);
  // 右墙
  ctx.fillRect(W-WALL_T, 0, WALL_T, H);
  // 地面
  ctx.fillRect(0, H-WALL_T, W, WALL_T);

  // 墙壁高光
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fillRect(WALL_T, 0, 2, H);
  ctx.fillRect(W-WALL_T-2, 0, 2, H);
}

// 绘制危险线
function drawDangerLine(){
  ctx.save();
  ctx.setLineDash([8,6]);
  ctx.strokeStyle = 'rgba(255,60,60,0.45)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(WALL_T, DANGER_Y);
  ctx.lineTo(W-WALL_T, DANGER_Y);
  ctx.stroke();
  ctx.restore();

  // 标签
  ctx.save();
  ctx.fillStyle = 'rgba(255,60,60,0.5)';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('⚠ 危险线', WALL_T+4, DANGER_Y-6);
  ctx.restore();
}

// 绘制投放预览
function drawPreview(){
  if(!canDrop || gameOver) return;
  const u = UNIS[currentTier];

  ctx.save();
  ctx.globalAlpha = 0.35;

  // 预览圆
  ctx.beginPath();
  ctx.arc(previewX, DROP_Y, u.radius, 0, Math.PI*2);
  ctx.fillStyle = u.color;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.setLineDash([5,4]);
  ctx.stroke();

  // 投放指示线
  ctx.beginPath();
  ctx.moveTo(previewX, DROP_Y + u.radius + 4);
  ctx.lineTo(previewX, H - WALL_T);
  ctx.strokeStyle = u.color + '55';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([3,6]);
  ctx.stroke();

  ctx.restore();
}

// 绘制粒子
function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.12;
    p.life--;
    if(p.life <= 0){ particles.splice(i,1); continue; }

    const t = p.life / p.maxLife;
    ctx.save();
    ctx.globalAlpha = t;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * t, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// 合并特效
function spawnMergeEffect(x, y, color, count){
  count = count || 14;
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2/count)*i + Math.random()*0.4;
    const speed = 2.5 + Math.random()*4;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed - 1,
      life: 25 + Math.random()*20,
      maxLife: 45,
      color: color,
      size: 2.5 + Math.random()*4
    });
  }
}

// ==================== 创建大学球体 ====================
function createUni(tier, x, y){
  const u = UNIS[tier];
  const body = Bodies.circle(x, y, u.radius, {
    restitution: 0.2,
    friction: 0.5,
    frictionAir: 0.001,
    density: 0.0008 + tier * 0.0002,
    label: 'uni'
  });
  body.gameTier = tier;
  body.mergeCooldown = 0;
  Composite.add(engine.world, body);
  uniBodies.push(body);
  return body;
}

function removeBody(body){
  Composite.remove(engine.world, body);
  uniBodies = uniBodies.filter(b => b !== body);
}

// ==================== 投放逻辑 ====================
function drop(){
  if(!canDrop || gameOver) return;
  canDrop = false;
  dropCooldown = 22;

  const tier = currentTier;
  currentTier = nextTier;
  nextTier = randTier();
  updateNextDisplay();

  const body = createUni(tier, previewX, DROP_Y);
  Body.setVelocity(body, { x:(Math.random()-0.5)*1.2, y:1.5 });
}

// ==================== 碰撞 & 合并 ====================
Events.on(engine, 'collisionStart', function(e){
  if(gameOver) return;
  for(const pair of e.pairs){
    const a = pair.bodyA, b = pair.bodyB;
    if(a.gameTier === undefined || b.gameTier === undefined) continue;
    if(a.gameTier !== b.gameTier) continue;
    if(a.mergeCooldown > 0 || b.mergeCooldown > 0) continue;
    if(a.gameTier >= UNIS.length - 1) continue;

    const newTier = a.gameTier + 1;
    const mx = (a.position.x + b.position.x) / 2;
    const my = (a.position.y + b.position.y) / 2;

    removeBody(a);
    removeBody(b);

    const newBody = createUni(newTier, mx, my);
    Body.setVelocity(newBody, { x:0, y:-2.5 });
    newBody.mergeCooldown = 15;

    score += UNIS[newTier].score;
    document.getElementById('score-display').textContent = '分数: ' + score;

    spawnMergeEffect(mx, my, UNIS[newTier].color);
    if(newTier === UNIS.length - 1){
      spawnMergeEffect(mx, my, '#ffd700', 28);
    }
  }
});

// ==================== 输入处理 ====================
function updatePreviewX(clientX){
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const u = UNIS[currentTier];
  const rawX = (clientX - rect.left) * scaleX;
  previewX = Math.max(WALL_T + u.radius + 2, Math.min(W - WALL_T - u.radius - 2, rawX));
}

const canvasWrap = document.getElementById('canvas-wrap');

canvasWrap.addEventListener('mousemove', e => updatePreviewX(e.clientX));
canvasWrap.addEventListener('click', e => { updatePreviewX(e.clientX); drop(); });

canvasWrap.addEventListener('touchmove', e => {
  e.preventDefault();
  updatePreviewX(e.touches[0].clientX);
}, {passive:false});
canvasWrap.addEventListener('touchend', e => { e.preventDefault(); drop(); }, {passive:false});

// ==================== 下一个预览 ====================
function updateNextDisplay(){
  const u = UNIS[currentTier];
  document.getElementById('next-icon').style.background = u.color;
  document.getElementById('next-name').textContent = u.name;
}
updateNextDisplay();

// ==================== 游戏结束检测 ====================
function checkGameOver(){
  for(const body of uniBodies){
    if(body.mergeCooldown > 0) continue;
    const r = UNIS[body.gameTier].radius;
    if(body.position.y - r < DANGER_Y
       && Math.abs(body.velocity.y) < 0.4
       && Math.abs(body.velocity.x) < 0.4){
      if(!body._dangerTimer) body._dangerTimer = 0;
      body._dangerTimer++;
      if(body._dangerTimer > 150){ endGame(); return; }
    } else {
      body._dangerTimer = 0;
    }
  }
}

function endGame(){
  gameOver = true;
  document.getElementById('final-score').textContent = '最终分数: ' + score;
  document.getElementById('game-over').classList.add('show');
}

document.getElementById('restart-btn').addEventListener('click', ()=>{
  for(const b of uniBodies) Composite.remove(engine.world, b);
  uniBodies = [];
  particles = [];
  score = 0;
  gameOver = false;
  canDrop = true;
  dropCooldown = 0;
  currentTier = randTier();
  nextTier = randTier();
  document.getElementById('score-display').textContent = '分数: 0';
  document.getElementById('game-over').classList.remove('show');
  updateNextDisplay();
});

// ==================== 主循环 ====================
function gameLoop(){
  // 物理步进
  Engine.update(engine, 1000/60);

  // 冷却
  if(!canDrop){
    dropCooldown--;
    if(dropCooldown <= 0) canDrop = true;
  }
  for(const b of uniBodies){
    if(b.mergeCooldown > 0) b.mergeCooldown--;
  }

  // 清理出界球体
  for(let i=uniBodies.length-1;i>=0;i--){
    if(uniBodies[i].position.y > H + 120) removeBody(uniBodies[i]);
  }

  // 游戏结束检测
  if(!gameOver && dropCooldown <= 0 && uniBodies.length > 0){
    checkGameOver();
  }

  // ===== 渲染 =====
  ctx.clearRect(0, 0, W, H);

  // 背景
  ctx.fillStyle = '#12122a';
  ctx.fillRect(0, 0, W, H);

  // 容器
  drawContainer();

  // 危险线
  drawDangerLine();

  // 投放预览
  drawPreview();

  // 大学球体
  for(const body of uniBodies){
    drawUni(body.position.x, body.position.y, body.gameTier);
  }

  // 粒子
  drawParticles();

  // 球体计数
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('球体: '+uniBodies.length, W-14, H-14);
  ctx.restore();

  requestAnimationFrame(gameLoop);
}

// 启动
const runner = Runner.create();
Runner.run(runner, engine);
requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
